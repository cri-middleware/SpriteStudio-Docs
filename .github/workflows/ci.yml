name: CI

# The site is all this repository builds, so every pull request builds it the way
# pages.yml publishes it: both locales, --strict, so a broken link fails the PR.
# The weekly run builds main, is what writes the caches PRs restore from, and
# checks the external links.
on:
  pull_request:
    # Unlike the sibling repositories, Markdown is not ignored: it is the content.
    paths-ignore:
      - '.gitignore'
      - 'LICENSE*'
  schedule:
    # Each repository of the family takes its own hour on Sunday, so their
    # weekly runs do not queue for the organization's runners; :17 keeps clear
    # of the top of the hour, when GitHub delays scheduled runs.
    - cron: '17 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 📚 Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Zensical's build cache, started over each ISO week as pages.yml does.
      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - name: Restore the Zensical cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      - name: Build the Pages tree (docs, both locales, strict validation)
        run: ./scripts/build-pages.sh prepare=no serve=no

      # Only main writes caches. A PR's cache is visible to that PR alone, so
      # saving one per PR would only fill the 10 GB quota.
      - name: Save the Zensical cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache

  links:
    name: 🔗 External links
    # The weekly run and a dispatch only: --strict checks the internal links on
    # every pull request, and a site that goes down mid-review is not the pull
    # request's fault. Links inside code blocks are examples, not links, and
    # lychee skips them. A 503 is a site saying it is down for now, as a
    # maintenance page does, not a broken link, so it is accepted on top of
    # lychee's default.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the external links in the pages and the repository's own docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --scheme https --scheme http --exclude-loopback --max-retries 3
            --accept '100..=103,200..=299,503'
            'docs/**/*.md' '*.md'
