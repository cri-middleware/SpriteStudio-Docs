name: Publish docs via GitHub Pages

on:
  # Publishing is manual: production is deployed by running this workflow
  # (workflow_dispatch), and nothing else triggers it. The sibling player repos
  # publish on `release: published` + dispatch; this portal cuts no releases, so
  # dispatch is the whole story here. ci.yml builds the same tree on every pull
  # request.
  workflow_dispatch:

# Least privilege: the site is published via the Pages deployment API (OIDC),
# not by pushing to a branch, so no `contents: write` is needed. Only the deploy
# job gets what that deployment needs (pages: write, id-token: write); the build
# job runs the repository's scripts and does not need them.
permissions:
  contents: read

# One concurrent deployment at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only main is published: a run started on another branch would replace the
      # site with that branch. It fails here rather than being skipped, so a run
      # that deployed nothing does not look like one that did.
      - name: Refuse to publish anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::pages.yml publishes main only; this run was started on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # Both steps below run the same scripts a contributor runs locally, and
      # ci.yml runs on every pull request, rather than repeating the commands
      # here. The fewer places the build is spelled out, the better:
      # scripts/build-docs.sh owns the locale order and the --strict
      # flag, scripts/build-pages.sh owns the tree this job uploads, and this
      # workflow just calls them.
      #
      # prepare-docs.sh creates .venv and installs the pins from
      # docs/requirements.txt; build-pages.sh then finds zensical there. (It falls
      # back to PATH when there is no venv, so a `pip install -r
      # docs/requirements.txt` step would still work here — but then CI and a
      # local build would be running different things.) It stays a step of its own so a
      # dependency failure is legible as one in the run summary, which is also why
      # build-pages.sh is invoked below with prepare=no.
      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      # scripts/build-pages.sh is the tree this job uploads. Here that is the two
      # locale builds and nothing else — the site carries no demo and no examples
      # — so it runs build-docs.sh and adds only what a working tree needs on top
      # (the toolchain, and a server to look at the result). It is the same
      # command in every repository in the family, whatever else that
      # repository's site carries.
      #
      # One build per locale — there is no plugin producing both from a single
      # run any more — English first, because the English build wipes site/ and
      # the Japanese site lives inside it at site/ja. build-docs.sh does them in
      # that order; the reason it exists is that the opposite order silently
      # publishes a site with no Japanese pages at all.
      #
      # --strict fails on broken links, so a publish aborts
      # rather than deploying a site with a dead link.
      #
      # Every option is spelled out rather than left to the script's defaults:
      # they are chosen for a working tree, and a publish should not change
      # because one of them did.
      - name: Build the Pages tree (docs, both locales, strict validation)
        run: ./scripts/build-pages.sh prepare=no serve=no

      # v4 stopped including dotfiles in the artifact. Nothing here is affected —
      # a Zensical build emits no hidden files (no .nojekyll either; the artifact
      # deployment does not run Jekyll) — but if one ever appears, the fix is
      # `include-hidden-files: true`, not a downgrade.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
