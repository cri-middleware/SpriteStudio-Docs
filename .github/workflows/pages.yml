name: Publish docs via GitHub Pages

on:
  # Publishing is manual: production is deployed by running this workflow
  # (workflow_dispatch), and nothing else triggers it. The sibling player repos
  # publish on `release: published` + dispatch; this portal cuts no releases, so
  # dispatch is the whole story here.
  #
  # Note there is no PR build any more, matching the siblings — `zensical build
  # --strict` no longer runs in CI at all, so run it locally before merging a
  # docs change. A broken internal link or missing nav entry would otherwise
  # only surface on the next manual publish.
  workflow_dispatch:

# Least privilege: the site is published via the Pages deployment API (OIDC),
# not by pushing to a branch, so no `contents: write` is needed.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # Both steps below run the same scripts a contributor runs locally, rather
      # than repeating the commands here. There is no PR build to catch a
      # divergence between the two, so the fewer places the build is spelled out,
      # the better: scripts/build.sh owns the locale order and the --strict flag,
      # and this workflow just calls it.
      #
      # prepare.sh creates .venv and installs the pins from docs/requirements.txt;
      # build.sh then finds zensical there. (It falls back to PATH when there is
      # no venv, so a `pip install -r docs/requirements.txt` step would still
      # work here — but then CI and the README would be running different things.)
      - name: Install dependencies
        run: ./scripts/prepare.sh

      # One build per locale — there is no plugin producing both from a single
      # run any more — English first, because the English build wipes site/ and
      # the Japanese site lives inside it at site/ja. build.sh does them in that
      # order; the reason it exists is that the opposite order silently publishes
      # a site with no Japanese pages at all.
      #
      # --strict fails on broken links / missing nav entries, so a publish aborts
      # rather than deploying a site with a dead link.
      - name: Build docs, both locales (strict validation)
        run: ./scripts/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
