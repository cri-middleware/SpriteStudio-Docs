name: Publish docs via GitHub Pages

on:
  # Publishing is manual: production is deployed by running this workflow
  # (workflow_dispatch), and nothing else triggers it. The sibling player repos
  # publish on `release: published` + dispatch; this portal cuts no releases, so
  # dispatch is the whole story here.
  #
  # Note there is no PR build any more, matching the siblings — `mkdocs build
  # --strict` no longer runs in CI at all, so run it locally before merging a
  # docs change. A broken internal link or missing nav entry would otherwise
  # only surface on the next manual publish.
  workflow_dispatch:

# Least privilege: the site is published via the Pages deployment API (OIDC),
# not by pushing to a branch, so no `contents: write` is needed.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # --strict fails the build on broken links / missing nav entries, so a
      # publish aborts rather than deploying a site with a dead link.
      - name: Build docs (strict validation)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
