name: Publish docs via GitHub Pages

on:
  # PRs get strict-build validation only (no deploy); production is published
  # by manually running this workflow (workflow_dispatch).
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: the site is published via the Pages deployment API (OIDC),
# not by pushing to a branch, so no `contents: write` is needed.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # Fail the build on broken links / missing nav entries so PRs catch it before merge.
      - name: Build docs (strict validation)
        run: mkdocs build --strict

      # Only a manual dispatch produces a deployable artifact; PRs validate only.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Deploy only on manual dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
