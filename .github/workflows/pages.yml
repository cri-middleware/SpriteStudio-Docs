name: Publish docs via GitHub Pages

on:
  # Publishing is manual: production is deployed by running this workflow
  # (workflow_dispatch), and nothing else triggers it.
  workflow_dispatch:

permissions:
  contents: read

# One concurrent deployment at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only main is published: a run started on another branch would replace the
      # site with that branch. It fails here rather than being skipped, so a run
      # that deployed nothing does not look like one that did.
      - name: Refuse to publish anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::pages.yml publishes main only; this run was started on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # A step of its own so a dependency failure is legible as one in the run
      # summary, which is also why build-pages.sh is invoked below with prepare=no.
      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      # Every option is spelled out rather than left to the script's defaults:
      # they are chosen for a working tree, and a publish should not change
      # because one of them did.
      - name: Build the Pages tree (docs, both locales, strict validation)
        run: ./scripts/build-pages.sh prepare=no serve=no

      # Dotfiles are left out of the artifact; set include-hidden-files: true if
      # the build ever emits one.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
