INHERIT: ./mkdocs.base.yml

docs_dir: docs/ja
site_dir: site/ja
site_url: "https://cri-middleware.github.io/SpriteStudio-Docs/ja/"
site_description: "SpriteStudio SDK と公式 Player 群のドキュメントポータル"

theme:
  language: ja

extra:
  site_root_prefix: "../"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: GitHub の cri-middleware
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: X の SpriteStudio

nav:
  - 🏠 ホーム: index.md
  - 🗺️ 概要:
      - エコシステム: overview/ecosystem.md
      - プラットフォームの選び方: overview/choose-your-platform.md
      - ブラウザで試す: overview/try-it.md
      - アセットの変換: overview/conversion.md
      - スタンドアロンツールでの変換: overview/convert-with-a-standalone-tool.md
      - Player ごとの違い: overview/player-differences.md
      - 🤖 AI アシスタントと使う: overview/ai-assistants.md
  - 🎮 Player・ツール:
      - Unity: players/unity.md
      - Web（Player コレクション）: players/web.md
      - Godot: players/godot.md
      - Flutter: players/flutter.md
      - Ren'Py: players/renpy.md
      - wgpu（Rust・C / C++）: players/wgpu.md
      - React Native: players/react-native.md
      - コンバーター GUI: players/converter.md
  - 🛠️ SDK・開発者向け:
      - コンセプト: sdk/concepts.md
      - 用語集: sdk/glossary.md
      - フォーマット仕様: sdk/format-spec.md
      - 共通の制限事項: sdk/limitations.md
      - Player の移植: sdk/porting.md
  - ℹ️ サポート・ライセンス:
      - 🤝 サポート: support.md
      - ⚖️ ライセンス: license.md
