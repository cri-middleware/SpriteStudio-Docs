INHERIT: ./mkdocs.base.yml

docs_dir: docs/ja
site_dir: site/ja
site_url: "https://cri-middleware.github.io/SpriteStudio-Docs/ja/"
site_description: "SpriteStudio SDK と公式 Player 群のドキュメントポータル"

theme:
  language: ja

extra:
  site_root_prefix: "../"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: GitHub の cri-middleware
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: X の SpriteStudio

nav:
  - 🏠 ホーム: index.md
  - 🗺️ 概要:
      - エコシステム: overview/ecosystem.md
      - プラットフォームの選び方: overview/choose-your-platform.md
      - ブラウザで試す: overview/try-it.md
      - アセットの変換: overview/conversion.md
      - スタンドアロンツールでの変換: overview/convert-with-a-standalone-tool.md
      - UI 統合: overview/ui-integration.md
      - Player ごとの違い: overview/player-differences.md
      - 🤖 AI アシスタントと使う: overview/ai-assistants.md
  - 🎮 Player・ツール:
      - Unity: players/unity.md
      - Web（Player コレクション）: players/web.md
      - Godot: players/godot.md
      - Flutter: players/flutter.md
      - Ren'Py: players/renpy.md
      - wgpu（Rust・C / C++）: players/wgpu.md
      - React Native: players/react-native.md
      - コンバーター GUI: players/converter.md
  - 🛠️ SDK・開発者向け:
      - コンセプト: sdk/concepts.md
      - 用語集: sdk/glossary.md
      - フォーマット仕様: sdk/format-spec.md
      - 共通の制限事項: sdk/limitations.md
      - Player の移植: sdk/porting.md
  - ℹ️ サポート・ライセンス:
      - 🤝 サポート: support.md
      - ⚖️ ライセンス: license.md

plugins:
  - search
  - redirects
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        SpriteStudio-SDK と公式 Player 群への入口です。各 Player のドキュメントはそれぞれのリポジトリのサイトにあるため、`players/` 以下のページは短い概要で、全 Player に共通することは `sdk/` 以下にあります。`overview/choose-your-platform` で Player を選び、`overview/ecosystem` で全体の構成が分かります。SpriteStudio プロジェクト（`.sspj`）は、どの Player で再生する前にも一度だけランタイム形式（`.ssab` / `.ssqb`）へ変換します。変換の経路は `overview/conversion` にあります。
      sections:
        概要:
          - index.md: "SDK の概要と、すべての公式 Player・ツールのカード。"
          - overview/ecosystem.md: "SpriteStudio プロジェクトが画面に出るまで。共通の Rust コアと、その上に構築された各 Player を図で示す。"
          - overview/choose-your-platform.md: "対象のランタイムから、使う公式 Player を選ぶ。"
          - overview/try-it.md: "インストール不要で、ブラウザで動くライブデモとホスト型コンバーター。"
          - overview/conversion.md: "SpriteStudio 7.6 以上のプロジェクト（`.sspj`）をランタイム形式（`.ssab` / `.ssqb`）へ変換する方法と、各 Player がどの経路を取るか。"
          - overview/convert-with-a-standalone-tool.md: "変換してくれる Player がないとき（CI を含む）に使うスタンドアロンコンバーターの選び方。"
          - overview/ui-integration.md: "SpriteStudio のアニメーションを UI ツールキットのボタンにする。ラベルで作る状態、絵の上だけのクリック、reduced motion と、対応する Player。"
          - overview/player-differences.md: "Player 間で違うことだけ。各エンジンの描画層が再現できる範囲と、各 Player の実装の進み具合。"
          - overview/ai-assistants.md: "このドキュメントを AI アシスタントに渡す方法。各サイトの llms.txt、各 Player のパッケージ内のドキュメントと、npm・Flutter のパッケージが持つ Agent Skill、AGENTS.md に貼る数行。"
        Player・ツール:
          - players/unity.md: "Unity 用 Player。エディタで始まる: `.sspj` をエディタにドラッグし、コンポーネントに割り当てる。"
          - players/web.md: "1 つの WebAssembly コアを共有する Web 用 Player 群（PixiJS・WebGL・RPG ツクール MZ・TyranoScript・ティラノビルダー）。"
          - players/godot.md: "Godot 用 Player。エディタで始まる: GDExtension とカスタムモジュールの 2 形態。"
          - players/flutter.md: "Flutter 用 Player。コードで始まる: `SpriteStudioView` ウィジェット。"
          - players/renpy.md: "Ren'Py 用 Player。コードで始まる: `SSPlayer` は標準的な Displayable。"
          - players/wgpu.md: "Rust で書かれた wgpu 用 Player。同じライブラリを C・C++・ブラウザからも使える。"
          - players/react-native.md: "React Native 用 Player。コードで始まる: `<SpriteStudioView>`。Expo Go ではなく development build が必要。"
          - players/converter.md: "`.sspj` プロジェクトを変換するデスクトップアプリ、コンバーター GUI。macOS と Windows 向けのビルドがある。"
        SDK・開発者向け:
          - sdk/concepts.md: "共通コアが提供するもの。変換してから再生するワークフローと、全 Player が共有する機能。"
          - sdk/glossary.md: "SDK と各 Player のドキュメントで使う用語の定義（`.sspj`、`.ssab`、セルマップ、アニメーションパック、パーツ種別）。"
          - sdk/format-spec.md: "`.ssab` / `.ssqb` バイナリ形式とランタイムの FFI インターフェースの要約。フィールド単位のスキーマは SDK リポジトリにある。"
          - sdk/limitations.md: "全 Player に当てはまる共通コアの制約。機能を約束する前に確認する。"
          - sdk/porting.md: "新しいエンジンに SpriteStudio を移植するための、SDK の Player 移植ガイドへの案内。"
        サポート・ライセンス:
          - support.md: "不具合の報告先と質問の窓口を、リポジトリごとに。"
          - license.md: "各リポジトリは自身のライセンスを同梱している。このページはそれぞれへリンクする。"
