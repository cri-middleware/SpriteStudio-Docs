site_name: SpriteStudio Docs
site_description: "Documentation portal for the SpriteStudio SDK and its official players"
site_author: "CRI Middleware Co., Ltd."
site_url: "https://cri-middleware.github.io/SpriteStudio-Docs/"
repo_name: "cri-middleware/SpriteStudio-Docs"
repo_url: "https://github.com/cri-middleware/SpriteStudio-Docs"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - ja
  - callouts
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            🏠 Home: 🏠 ホーム
            🗺️ Overview: 🗺️ 概要
            Ecosystem: エコシステム
            Choose Your Platform: プラットフォームの選び方
            Try It in Your Browser: ブラウザで試す
            🔄 Converting Assets: 🔄 アセットの変換
            Overview: 概要
            Standalone Tools: スタンドアロンツール
            🛠️ SDK & Development: 🛠️ SDK・開発者向け
            Concepts: コンセプト
            Format Specification: フォーマット仕様
            Porting a Player: Player の移植
            🎮 Players & Tools: 🎮 Player・ツール
            Unity: Unity
            Web (Player Collection): Web（Player コレクション）
            Godot: Godot
            Ren'Py: Ren'Py
            Flutter: Flutter
            Converter GUI: コンバーター GUI
            ⚖️ License: ⚖️ ライセンス

nav:
  - 🏠 Home: index.md
  - 🗺️ Overview:
      - Ecosystem: overview/ecosystem.md
      - Choose Your Platform: overview/choose-your-platform.md
      - Try It in Your Browser: overview/try-it.md
  - 🔄 Converting Assets:
      - Overview: overview/conversion.md
      - Standalone Tools: overview/convert-with-a-standalone-tool.md
  - 🎮 Players & Tools:
      - Unity: players/unity.md
      - Web (Player Collection): players/web.md
      - Godot: players/godot.md
      - Flutter: players/flutter.md
      - Ren'Py: players/renpy.md
      - Converter GUI: players/converter.md
  - 🛠️ SDK & Development:
      - Concepts: sdk/concepts.md
      - Format Specification: sdk/format-spec.md
      - Porting a Player: sdk/porting.md
  - ⚖️ License: license.md

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  # Required by Material's "grid cards" (index.md) - the `markdown` attr on the
  # wrapping <div> and the `{ .card }`-style attributes both need these two.
  - attr_list
  - md_in_html
  # Renders the :material-*: / :octicons-*: / :simple-*: icon shortcodes as SVGs.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true

extra:
  alternate:
    - name: English
      link: /SpriteStudio-Docs/
      lang: en
    - name: 日本語
      link: /SpriteStudio-Docs/ja/
      lang: ja
