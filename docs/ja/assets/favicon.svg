<!--
  Placeholder favicon: a play triangle on the theme's blue-grey primary (#546e7a), matching
  the `icon.logo` set in mkdocs.base.yml. Deliberately plain geometry rather than product
  artwork - swap it for the real SpriteStudio mark when one is available.

  One copy per locale, on purpose: each locale builds from its own `docs_dir`, and Zensical
  serves nothing from outside it - a shared docs/assets/ is never copied, and a symlink is
  skipped. docs/en/assets/ and docs/ja/assets/ carry the same file; change both.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SpriteStudio Docs">
  <rect width="64" height="64" rx="14" fill="#546e7a"/>
  <path d="M25 19.5 46 32 25 44.5Z" fill="#fff"/>
</svg>
